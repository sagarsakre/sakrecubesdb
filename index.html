<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ReelShot: Field Reference Companion</title>
  
  <!-- iOS PWA Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ReelShot">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#080c14">

  <style>
    :root {
      --bg: #080c14;
      --card-bg: rgba(22, 29, 45, 0.78);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent: #6366f1;
      --accent-glow: rgba(99, 102, 241, 0.35);
      --success: #10b981;
      --success-glow: rgba(16, 185, 129, 0.35);
      --danger: #ef4444;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --dimmed-opacity: 0.35;
      --radius: 18px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      padding-bottom: calc(var(--safe-bottom) + 30px);
    }

    /* Top Glass Header */
    .top-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(8, 12, 20, 0.88);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-bottom: 1px solid var(--card-border);
      padding: calc(var(--safe-top) + 12px) 16px 14px 16px;
    }

    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      width: 32px;
      height: 32px;
      border-radius: 9px;
      background: linear-gradient(135deg, #6366f1, #ec4899);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
    }

    .brand-title {
      font-size: 19px;
      font-weight: 700;
      letter-spacing: -0.4px;
    }

    /* Container */
    .container {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      padding: 16px;
    }

    /* Screen Views */
    .view {
      display: none;
    }
    .view.active {
      display: block;
    }

    /* Home View (Active Trip Board) */
    .section-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .home-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-library-trigger {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 7px 14px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      box-shadow: 0 4px 12px var(--accent-glow);
      transition: all 0.2s;
    }

    .btn-library-trigger:active {
      transform: scale(0.95);
    }

    .reels-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .reel-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      overflow: hidden;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      transition: transform 0.15s, border-color 0.2s;
      position: relative;
    }

    .reel-card:active {
      transform: scale(0.98);
      border-color: var(--accent);
    }

    .reel-cover-box {
      width: 100%;
      height: 200px;
      position: relative;
      background: #111827;
      overflow: hidden;
    }

    .reel-cover-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .reel-badge {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      color: #fff;
    }

    .reel-offline-chip {
      position: absolute;
      bottom: 12px;
      left: 12px;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 5px;
      backdrop-filter: blur(10px);
    }

    .reel-offline-chip.cached {
      background: rgba(16, 185, 129, 0.85);
      color: #fff;
    }

    .reel-offline-chip.online {
      background: rgba(0, 0, 0, 0.65);
      color: var(--text-muted);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .reel-info {
      padding: 16px;
    }

    .reel-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 4px;
      letter-spacing: -0.3px;
    }

    .reel-subtitle {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .progress-bar-wrap {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 99px;
      overflow: hidden;
      margin-bottom: 8px;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #6366f1, #10b981);
      width: 0%;
      border-radius: 99px;
      transition: width 0.4s ease;
    }

    .progress-text {
      font-size: 13px;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      font-weight: 500;
    }

    /* Detail View Headers */
    .detail-nav-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      gap: 10px;
    }

    .detail-nav-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Circular Download Button with SVG Progress Ring */
    .dl-btn-container {
      position: relative;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--card-border);
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      flex-shrink: 0;
    }

    .dl-btn-container:active {
      transform: scale(0.92);
    }

    .dl-btn-container.hidden {
      opacity: 0;
      transform: scale(0.6);
      pointer-events: none;
      width: 0;
      margin: 0;
      border: none;
      overflow: hidden;
    }

    .progress-ring {
      position: absolute;
      top: 0;
      left: 0;
      transform: rotate(-90deg);
      border-radius: 50%;
    }

    .progress-ring-bg {
      stroke: rgba(255, 255, 255, 0.14);
    }

    .progress-ring-fill {
      stroke: var(--accent);
      stroke-dasharray: 87.96;
      stroke-dashoffset: 87.96;
      transition: stroke-dashoffset 0.25s linear, stroke 0.3s ease;
    }

    .progress-ring-fill.done {
      stroke: var(--success);
    }

    .dl-btn-content {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: #fff;
    }

    .dl-counter-text {
      font-size: 9px;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.5px;
    }

    .back-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      background: none;
      border: none;
      color: var(--accent);
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      padding: 6px 0;
    }

    .detail-title-box {
      margin-bottom: 14px;
    }

    .detail-main-title {
      font-size: 21px;
      font-weight: 700;
      letter-spacing: -0.4px;
    }

    .detail-sub-title {
      font-size: 14px;
      color: var(--text-muted);
      margin-top: 3px;
    }

    /* Counter Banner */
    .counter-banner {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 12px 16px;
      margin-bottom: 16px;
    }

    .counter-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 600;
    }

    .counter-highlight {
      color: var(--success);
      font-size: 15px;
      font-weight: 700;
    }

    /* Continuous Shot Cards List */
    .shots-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
      transition: all 0.3s ease;
    }

    .shot-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
      position: relative;
      order: 0;
      transform: translateX(0);
      opacity: 1;
      filter: grayscale(0%);
      transition: transform 0.42s cubic-bezier(0.2, 0.85, 0.3, 1),
                  opacity 0.42s ease,
                  filter 0.42s ease,
                  border-color 0.3s ease,
                  box-shadow 0.3s ease;
    }

    .shot-card.animating-out {
      transform: translateX(28px);
      opacity: 0.6;
      border-color: rgba(16, 185, 129, 0.5);
      box-shadow: 0 0 20px rgba(16, 185, 129, 0.25);
    }

    .shot-card.completed {
      order: 1;
      opacity: var(--dimmed-opacity);
      filter: grayscale(25%);
    }

    .shot-card.completed:active {
      opacity: 0.7;
    }

    .shot-header {
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(255, 255, 255, 0.03);
      border-bottom: 1px solid var(--card-border);
      cursor: pointer;
    }

    .shot-check {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.26s cubic-bezier(0.34, 1.56, 0.64, 1);
      cursor: pointer;
      background: rgba(0, 0, 0, 0.3);
    }

    .shot-header:active .shot-check {
      transform: scale(0.85);
    }

    .shot-card.completed .shot-check {
      background: var(--success);
      border-color: var(--success);
      box-shadow: 0 0 14px rgba(16, 185, 129, 0.45);
    }

    .shot-check svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: #fff;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0;
      transform: scale(0.5);
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .shot-card.completed .shot-check svg {
      opacity: 1;
      transform: scale(1);
    }

    .shot-meta {
      flex: 1;
      min-width: 0;
    }

    .shot-title-text {
      font-size: 15px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      letter-spacing: -0.2px;
    }

    .shot-duration-pill {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 500;
      margin-top: 2px;
    }

    .shot-gif-box {
      width: 100%;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 280px;
      position: relative;
    }

    .shot-gif-box img {
      width: 100%;
      max-width: 640px;
      height: auto;
      display: block;
      margin: 0 auto;
    }

    /* Master Library Modal Sheet */
    .library-modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.82);
      backdrop-filter: blur(16px);
      z-index: 250;
      display: none;
      flex-direction: column;
    }

    .library-modal.active {
      display: flex;
    }

    .library-header {
      background: rgba(19, 27, 46, 0.95);
      border-bottom: 1px solid var(--card-border);
      padding: calc(var(--safe-top) + 12px) 16px 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .library-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .library-title {
      font-size: 18px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .library-search-box {
      position: relative;
      width: 100%;
    }

    .library-search-input {
      width: 100%;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 10px 14px 10px 36px;
      color: #fff;
      font-size: 14px;
      outline: none;
    }

    .library-search-input:focus {
      border-color: var(--accent);
    }

    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 14px;
      color: var(--text-muted);
    }

    .library-action-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .btn-import-submit {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 9px 16px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-import-submit:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      box-shadow: none;
    }

    .library-content {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: 600px;
      width: 100%;
      margin: 0 auto;
    }

    .library-item {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 12px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .library-item:active {
      transform: scale(0.98);
    }

    .library-item.selected {
      border-color: var(--accent);
      background: rgba(99, 102, 241, 0.15);
    }

    .library-item-thumb {
      width: 64px;
      height: 64px;
      border-radius: 10px;
      object-fit: cover;
      background: #111;
      flex-shrink: 0;
    }

    .library-item-info {
      flex: 1;
      min-width: 0;
    }

    .library-item-title {
      font-size: 15px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 2px;
    }

    .library-item-sub {
      font-size: 12px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .library-item-meta {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 4px;
      display: flex;
      gap: 8px;
    }

    .library-item-badge {
      font-size: 11px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 99px;
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
      border: 1px solid rgba(16, 185, 129, 0.3);
      flex-shrink: 0;
    }

    .library-checkbox {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.2s;
    }

    .library-item.selected .library-checkbox {
      background: var(--accent);
      border-color: var(--accent);
    }

    .library-checkbox svg {
      width: 14px;
      height: 14px;
      fill: none;
      stroke: #fff;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0;
      transform: scale(0.5);
      transition: all 0.2s;
    }

    .library-item.selected .library-checkbox svg {
      opacity: 1;
      transform: scale(1);
    }

    /* Standard Modals */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(14px);
      z-index: 200;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-box {
      background: #131b2e;
      border: 1px solid var(--card-border);
      border-radius: 22px;
      width: 100%;
      max-width: 440px;
      padding: 24px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
    }

    .modal-title {
      font-size: 19px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .modal-desc {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 18px;
      line-height: 1.5;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }

    .btn {
      padding: 10px 18px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
    }

    .btn-danger {
      background: #ef4444;
      color: #fff;
    }

    .btn:active {
      transform: scale(0.95);
    }

    /* Toast Notification */
    .status-toast {
      position: fixed;
      bottom: calc(var(--safe-bottom) + 16px);
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: rgba(16, 24, 40, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(16px);
      padding: 9px 20px;
      border-radius: 99px;
      font-size: 13px;
      font-weight: 600;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 300;
      pointer-events: none;
    }

    .status-toast.show {
      transform: translateX(-50%) translateY(0);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--success);
    }
  </style>
</head>
<body>

  <!-- Top Glass Bar: Brand Only -->
  <header class="top-header">
    <div class="header-row">
      <div class="brand">
        <div class="brand-icon">🎬</div>
        <div class="brand-title">ReelShot</div>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="container">

    <!-- 1. Home View (Active Trip Board) -->
    <section id="view-home" class="view active">
      <div class="section-title">
        <span id="home-board-title">Trip Board</span>
        <div class="home-actions">
          <button class="btn-library-trigger" onclick="openLibraryModal()">
            📚 Browse Library
          </button>
        </div>
      </div>
      <div class="reels-grid" id="reels-list">
        <!-- Injected via JavaScript -->
      </div>
    </section>

    <!-- 2. Detail View (Reel continuous shot list) -->
    <section id="view-detail" class="view">
      
      <!-- Nav Row: Back button on left, Download + Single Options button together on right -->
      <div class="detail-nav-row">
        <button class="back-btn" onclick="showHomeView()">← Trip Board</button>
        
        <div class="detail-nav-actions">
          <!-- Circular Download Button: Sits next to Options, automatically disappears once downloaded -->
          <div class="dl-btn-container hidden" id="reel-dl-btn" title="Download for Offline Use" onclick="downloadCurrentReelOffline()">
            <svg class="progress-ring" width="32" height="32">
              <circle class="progress-ring-bg" stroke="rgba(255,255,255,0.14)" stroke-width="3" fill="transparent" r="14" cx="16" cy="16"/>
              <circle class="progress-ring-fill" id="dl-progress-ring-fill" stroke-width="3" stroke-linecap="round" fill="transparent" r="14" cx="16" cy="16"/>
            </svg>
            <div class="dl-btn-content" id="dl-btn-inner">
              <span id="dl-icon-symbol" style="font-size: 13px;">⬇</span>
            </div>
          </div>

          <!-- Single Options Button -->
          <button class="btn btn-secondary" style="padding: 6px 12px; font-size: 12px; display: flex; align-items: center; gap: 4px;" onclick="openOptionsModal()">
            ⚙️ Options
          </button>
        </div>
      </div>

      <div class="detail-title-box">
        <h1 class="detail-main-title" id="detail-title">Bangalore City Escape</h1>
        <div class="detail-sub-title" id="detail-subtitle">2.5 Hours from Bangalore (Resort Reel)</div>
      </div>

      <!-- Sticky Counter Banner -->
      <div class="counter-banner">
        <div class="counter-row">
          <span>Field Progress</span>
          <span class="counter-highlight" id="counter-text">0 / 20 Shots</span>
        </div>
        <div class="progress-bar-wrap">
          <div class="progress-bar-fill" id="detail-progress-fill"></div>
        </div>
      </div>

      <!-- Continuous Shot Cards List -->
      <div class="shots-list" id="shots-container">
        <!-- Injected via JavaScript -->
      </div>

    </section>

  </main>

  <!-- Master Catalog / Library Browser Modal -->
  <div class="library-modal" id="library-modal">
    <div class="library-header">
      <div class="library-title-row">
        <div class="library-title">
          <span>📚 Master Reel Library</span>
          <span id="library-count-badge" style="font-size: 12px; color: var(--text-muted); font-weight: 500;">(0 available)</span>
        </div>
        <button class="btn btn-secondary" style="padding: 4px 10px; font-size: 13px; border-radius: 20px;" onclick="closeLibraryModal()">✕ Done</button>
      </div>

      <div class="library-search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="library-search" class="library-search-input" placeholder="Search destinations or titles..." oninput="filterLibrary()">
      </div>

      <div class="library-action-bar">
        <span id="library-selected-count" style="font-size: 13px; color: var(--text-muted);">0 selected</span>
        <button class="btn-import-submit" id="btn-import-selected" disabled onclick="importSelectedToBoard()">
          Add to Trip Board
        </button>
      </div>
    </div>

    <div class="library-content" id="library-items-list">
      <!-- Injected via JavaScript -->
    </div>
  </div>

  <!-- Options Modal for Current Reel -->
  <div class="modal-overlay" id="options-modal">
    <div class="modal-box">
      <h2 class="modal-title">Trip Options</h2>
      <p class="modal-desc" id="options-modal-reel-name">Manage settings for this reel reference.</p>
      
      <div style="display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px;">
        <button class="btn btn-secondary" style="width: 100%; text-align: left; padding: 12px;" onclick="resetChecksForCurrentReel()">
          🔄 Reset All Checkmarks
        </button>
        <button class="btn btn-secondary" style="width: 100%; text-align: left; padding: 12px;" onclick="clearOfflineFilesForCurrentReel()">
          🧹 Clear Downloaded Offline GIFs (Free Space)
        </button>
        <button class="btn btn-danger" style="width: 100%; text-align: left; padding: 12px;" onclick="removeCurrentReelFromBoard()">
          🗑️ Remove from Trip Board
        </button>
      </div>

      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="closeOptionsModal()">Close</button>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div class="status-toast" id="toast">
    <div class="status-dot" id="toast-dot"></div>
    <span id="toast-text">Ready</span>
  </div>

  <script>
    /* ========================================================================
       INDEXED-DB STORAGE ENGINE:
       Works 100% reliably on HTTP and HTTPS without browser context issues.
       ======================================================================== */
    const DB_NAME = 'ReelShotDB';
    const DB_VERSION = 1;
    let dbInstance = null;

    function openDB() {
      return new Promise((resolve, reject) => {
        if (dbInstance) return resolve(dbInstance);
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains('media')) {
            const store = db.createObjectStore('media', { keyPath: 'url' });
            store.createIndex('reelId', 'reelId', { unique: false });
          }
          if (!db.objectStoreNames.contains('reels_meta')) {
            db.createObjectStore('reels_meta', { keyPath: 'id' });
          }
        };
        req.onsuccess = (e) => {
          dbInstance = e.target.result;
          resolve(dbInstance);
        };
        req.onerror = (e) => reject(e);
      });
    }

    async function saveMediaBlob(url, blob, reelId) {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction('media', 'readwrite');
        const store = tx.objectStore('media');
        store.put({ url, blob, reelId, timestamp: Date.now() });
        tx.oncomplete = () => resolve(true);
        tx.onerror = () => reject(tx.error);
      });
    }

    async function getMediaBlob(url) {
      if (!url) return null;
      const db = await openDB();
      return new Promise((resolve) => {
        const tx = db.transaction('media', 'readonly');
        const store = tx.objectStore('media');
        const req = store.get(url);
        req.onsuccess = () => {
          if (req.result) {
            resolve(req.result.blob);
          } else {
            // Check fallback variant (e.g. resolved full CDN URL vs relative key)
            const fallbackKey = url.startsWith('http') 
              ? url.replace(/^https?:\/\/[^\/]+\//, '') 
              : resolveMediaUrl(url);
            if (fallbackKey && fallbackKey !== url) {
              const req2 = store.get(fallbackKey);
              req2.onsuccess = () => resolve(req2.result ? req2.result.blob : null);
              req2.onerror = () => resolve(null);
            } else {
              resolve(null);
            }
          }
        };
        req.onerror = () => resolve(null);
      });
    }

    async function isReelDownloaded(reelId) {
      const db = await openDB();
      return new Promise((resolve) => {
        const tx = db.transaction('reels_meta', 'readonly');
        const store = tx.objectStore('reels_meta');
        const req = store.get(reelId);
        req.onsuccess = () => resolve(req.result ? req.result.isDownloaded === true : false);
        req.onerror = () => resolve(false);
      });
    }

    async function setReelDownloaded(reelId, status) {
      const db = await openDB();
      return new Promise((resolve) => {
        const tx = db.transaction('reels_meta', 'readwrite');
        const store = tx.objectStore('reels_meta');
        store.put({ id: reelId, isDownloaded: status, updatedAt: Date.now() });
        tx.oncomplete = () => resolve(true);
      });
    }

    async function purgeReelMedia(reelId) {
      const db = await openDB();
      return new Promise((resolve) => {
        const tx = db.transaction(['media', 'reels_meta'], 'readwrite');
        const mediaStore = tx.objectStore('media');
        const index = mediaStore.index('reelId');
        const req = index.getAllKeys(reelId);

        req.onsuccess = () => {
          const keys = req.result;
          keys.forEach(k => mediaStore.delete(k));
        };

        const metaStore = tx.objectStore('reels_meta');
        metaStore.delete(reelId);

        tx.oncomplete = () => resolve(true);
      });
    }

    /* ========================================================================
       MASTER CATALOG & ACTIVE TRIP BOARD STATE
       ======================================================================== */
    const CDN_BASE_URL = 'https://pub-fd6036bfc4d84b359e94558bed250b7c.r2.dev';

    function resolveMediaUrl(path) {
      if (!path) return '';
      if (path.startsWith('http://') || path.startsWith('https://')) return path;
      return `${CDN_BASE_URL}/${path.replace(/^\/+/, '')}`;
    }

    let currentReel = null;
    let masterCatalog = [];       // Master archive from server / Cloudflare R2
    let selectedLibraryIds = new Set();
    let isDownloading = false;
    const objectUrlMap = new Map();
    const RING_CIRCUMFERENCE = 87.96; // 2 * PI * 14

    // Helper: Active Reel IDs for this phone device
    function getActiveReelIds() {
      const stored = localStorage.getItem('reelshot_active_reel_ids');
      if (stored !== null) {
        return JSON.parse(stored);
      }
      // First run default: activate the first available reel
      return ['bangalore-escape'];
    }

    function setActiveReelIds(ids) {
      localStorage.setItem('reelshot_active_reel_ids', JSON.stringify(ids));
    }

    // Load Master Catalog from Cloudflare R2 CDN (fallback to local/offline cache)
    async function loadMasterCatalog() {
      try {
        const res = await fetch(resolveMediaUrl('data/reels.json'), { cache: 'no-cache' });
        if (res.ok) {
          masterCatalog = await res.json();
          localStorage.setItem('reelshot_cached_catalog', JSON.stringify(masterCatalog));
        } else {
          throw new Error('CDN status ' + res.status);
        }
      } catch (err) {
        const cached = localStorage.getItem('reelshot_cached_catalog');
        if (cached) {
          masterCatalog = JSON.parse(cached);
        } else {
          try {
            const localRes = await fetch('data/reels.json');
            masterCatalog = await localRes.json();
          } catch (e) {
            masterCatalog = [{
              id: 'bangalore-escape',
              title: 'Bangalore City Escape',
              subtitle: '2.5 Hours from Bangalore (Resort Reel)',
              thumbnail: 'data/reels/bangalore-escape/thumbnail.jpg',
              reel_json: 'data/reels/bangalore-escape/reel.json',
              total_shots: 20,
              created_at: '2026-11-21T13:26:00Z'
            }];
          }
        }
      }

      // Ensure chronological ordering: newest first
      masterCatalog.sort((a, b) => (b.created_at || '').localeCompare(a.created_at || ''));
      await renderActiveBoard();
    }

    // Render Home Screen (Only active reels for this trip)
    async function renderActiveBoard() {
      const activeIds = getActiveReelIds();
      const activeReels = masterCatalog.filter(r => activeIds.includes(r.id));
      
      const listEl = document.getElementById('reels-list');
      const boardTitle = document.getElementById('home-board-title');
      listEl.innerHTML = '';

      boardTitle.textContent = `Trip Board (${activeReels.length} Active)`;

      if (activeReels.length === 0) {
        listEl.innerHTML = `
          <div style="text-align: center; padding: 50px 20px; color: var(--text-muted);">
            <div style="font-size: 46px; margin-bottom: 12px;">🗺️</div>
            <h3 style="color: #fff; font-size: 17px; margin-bottom: 6px;">Your Trip Board is Empty</h3>
            <p style="font-size: 13px; line-height: 1.5; margin-bottom: 20px;">Select from your master library to pick the reference reels for your upcoming trip.</p>
            <button class="btn-library-trigger" style="margin: 0 auto;" onclick="openLibraryModal()">
              📚 Browse Master Library
            </button>
          </div>
        `;
        return;
      }

      for (const reel of activeReels) {
        const checks = getCheckedShots(reel.id);
        const count = checks.length;
        const total = reel.total_shots || 20;
        const pct = Math.round((count / total) * 100);

        const isDownloaded = await isReelDownloaded(reel.id);

        const card = document.createElement('div');
        card.className = 'reel-card';
        card.onclick = () => openReel(reel);

        const thumbUrl = resolveMediaUrl(reel.thumbnail);

        card.innerHTML = `
          <div class="reel-cover-box">
            <img class="reel-cover-img" id="thumb-${reel.id}" src="${thumbUrl}" alt="${reel.title}" loading="lazy">
            <div class="reel-badge">${total} Shots</div>
            <div class="reel-offline-chip ${isDownloaded ? 'cached' : 'online'}">
              <span>${isDownloaded ? '⚡' : '☁️'}</span>
              <span>${isDownloaded ? 'Saved Offline' : 'Online'}</span>
            </div>
          </div>
          <div class="reel-info">
            <h3 class="reel-title">${reel.title}</h3>
            <div class="reel-subtitle">${reel.subtitle || ''}</div>
            <div class="progress-bar-wrap">
              <div class="progress-bar-fill" style="width: ${pct}%"></div>
            </div>
            <div class="progress-text">
              <span>Progress</span>
              <span>${count} / ${total} Shots (${pct}%)</span>
            </div>
          </div>
        `;
        listEl.appendChild(card);

        // Load thumbnail from IndexedDB if offline cached
        getMediaBlob(thumbUrl).then(blob => {
          if (blob) {
            const blobUrl = URL.createObjectURL(blob);
            const img = document.getElementById(`thumb-${reel.id}`);
            if (img) img.src = blobUrl;
          }
        });
      }
    }

    /* ========================================================================
       MASTER CATALOG / LIBRARY BROWSER
       ======================================================================== */
    function openLibraryModal() {
      selectedLibraryIds.clear();
      document.getElementById('library-search').value = '';
      updateImportButtonState();
      renderLibraryList(masterCatalog);
      document.getElementById('library-count-badge').textContent = `(${masterCatalog.length} available)`;
      document.getElementById('library-modal').classList.add('active');
    }

    function closeLibraryModal() {
      document.getElementById('library-modal').classList.remove('active');
    }

    function filterLibrary() {
      const q = document.getElementById('library-search').value.toLowerCase().trim();
      if (!q) {
        renderLibraryList(masterCatalog);
        return;
      }
      const filtered = masterCatalog.filter(r => 
        (r.title || '').toLowerCase().includes(q) ||
        (r.subtitle || '').toLowerCase().includes(q)
      );
      renderLibraryList(filtered);
    }

    function renderLibraryList(reels) {
      const container = document.getElementById('library-items-list');
      const activeIds = getActiveReelIds();
      container.innerHTML = '';

      if (reels.length === 0) {
        container.innerHTML = `
          <div style="text-align: center; padding: 40px 20px; color: var(--text-muted);">
            <p>No matching reels found.</p>
          </div>
        `;
        return;
      }

      reels.forEach(reel => {
        const isOnBoard = activeIds.includes(reel.id);
        const isSelected = selectedLibraryIds.has(reel.id);

        const item = document.createElement('div');
        item.className = `library-item ${isSelected ? 'selected' : ''}`;
        
        if (!isOnBoard) {
          item.onclick = () => toggleLibrarySelection(reel.id);
        }

        const dateStr = reel.created_at ? new Date(reel.created_at).toLocaleDateString() : '';
        const thumbUrl = resolveMediaUrl(reel.thumbnail);

        item.innerHTML = `
          <img class="library-item-thumb" src="${thumbUrl}" alt="${reel.title}" loading="lazy">
          <div class="library-item-info">
            <div class="library-item-title">${reel.title}</div>
            <div class="library-item-sub">${reel.subtitle || ''}</div>
            <div class="library-item-meta">
              <span>${reel.total_shots} shots</span>
              ${dateStr ? `<span>• ${dateStr}</span>` : ''}
            </div>
          </div>
          ${isOnBoard 
            ? `<div class="library-item-badge">✓ On Board</div>` 
            : `<div class="library-checkbox">
                 <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
               </div>`
          }
        `;
        container.appendChild(item);
      });
    }

    function toggleLibrarySelection(reelId) {
      if (selectedLibraryIds.has(reelId)) {
        selectedLibraryIds.delete(reelId);
      } else {
        selectedLibraryIds.add(reelId);
      }
      updateImportButtonState();
      filterLibrary(); // re-render with new selection state
    }

    function updateImportButtonState() {
      const count = selectedLibraryIds.size;
      const btn = document.getElementById('btn-import-selected');
      const counterText = document.getElementById('library-selected-count');

      counterText.textContent = `${count} selected`;
      if (count > 0) {
        btn.disabled = false;
        btn.textContent = `Add to Trip Board (${count})`;
      } else {
        btn.disabled = true;
        btn.textContent = `Add to Trip Board`;
      }
    }

    function importSelectedToBoard() {
      if (selectedLibraryIds.size === 0) return;

      const activeIds = getActiveReelIds();
      selectedLibraryIds.forEach(id => {
        if (!activeIds.includes(id)) {
          activeIds.push(id);
        }
      });

      setActiveReelIds(activeIds);
      const count = selectedLibraryIds.size;
      closeLibraryModal();
      renderActiveBoard();
      showToast(`Added ${count} reel${count > 1 ? 's' : ''} to Trip Board!`);
    }

    /* ========================================================================
       REEL DETAIL VIEW
       ======================================================================== */
    async function openReel(reelSummary) {
      const fullJsonUrl = resolveMediaUrl(reelSummary.reel_json);
      try {
        const res = await fetch(fullJsonUrl);
        currentReel = await res.json();
      } catch (err) {
        const blob = await getMediaBlob(fullJsonUrl) || await getMediaBlob(reelSummary.reel_json);
        if (blob) {
          const text = await blob.text();
          currentReel = JSON.parse(text);
        } else {
          showToast('Error loading reel data');
          return;
        }
      }

      document.getElementById('detail-title').textContent = currentReel.title;
      document.getElementById('detail-subtitle').textContent = currentReel.subtitle || '';

      await updateDownloadButtonState();
      await renderShots(currentReel);
      updateProgress();

      document.getElementById('view-home').classList.remove('active');
      document.getElementById('view-detail').classList.add('active');
      window.scrollTo(0, 0);
    }

    function showHomeView() {
      document.getElementById('view-detail').classList.remove('active');
      document.getElementById('view-home').classList.add('active');
      document.getElementById('reel-dl-btn').classList.add('hidden');
      renderActiveBoard();
    }

    /* ========================================================================
       DOWNLOAD BUTTON & CIRCULAR PROGRESS
       ======================================================================== */
    async function updateDownloadButtonState() {
      if (!currentReel) return;
      const dlBtn = document.getElementById('reel-dl-btn');
      const inner = document.getElementById('dl-btn-inner');
      const fillRing = document.getElementById('dl-progress-ring-fill');

      const isDownloaded = await isReelDownloaded(currentReel.id);

      if (isDownloaded) {
        dlBtn.classList.add('hidden');
      } else {
        dlBtn.classList.remove('hidden');
        fillRing.style.strokeDashoffset = RING_CIRCUMFERENCE;
        fillRing.classList.remove('done');
        inner.innerHTML = '<span id="dl-icon-symbol" style="font-size: 13px;">⬇</span>';
      }
    }

    async function downloadCurrentReelOffline() {
      if (!currentReel || isDownloading) return;

      const isDownloaded = await isReelDownloaded(currentReel.id);
      if (isDownloaded) return;

      isDownloading = true;
      const dlBtn = document.getElementById('reel-dl-btn');
      const inner = document.getElementById('dl-btn-inner');
      const fillRing = document.getElementById('dl-progress-ring-fill');

      const basePath = currentReel.reel_json ? currentReel.reel_json.substring(0, currentReel.reel_json.lastIndexOf('/') + 1) : 'data/reels/' + currentReel.id + '/';

      const items = [
        { url: resolveMediaUrl(basePath + 'reel.json'), rawKey: basePath + 'reel.json' },
        { url: resolveMediaUrl(basePath + currentReel.thumbnail), rawKey: basePath + currentReel.thumbnail },
        ...currentReel.shots.map(s => ({ 
          url: resolveMediaUrl(basePath + s.clip), 
          rawKey: basePath + s.clip, 
          shotId: s.id 
        }))
      ];

      const totalItems = currentReel.shots.length;
      let shotCount = 0;

      for (let i = 0; i < items.length; i++) {
        const item = items[i];
        try {
          const res = await fetch(item.url);
          const blob = await res.blob();
          await saveMediaBlob(item.url, blob, currentReel.id);
          if (item.rawKey && item.rawKey !== item.url) {
            await saveMediaBlob(item.rawKey, blob, currentReel.id);
          }

          if (item.shotId) {
            shotCount++;
            const blobUrl = URL.createObjectURL(blob);
            const img = document.getElementById(`img-shot-${item.shotId}`);
            if (img) img.src = blobUrl;
          }
        } catch (e) {
          console.warn('Download error:', item.url, e);
        }

        const progressPct = ((i + 1) / items.length);
        const offset = RING_CIRCUMFERENCE - (progressPct * RING_CIRCUMFERENCE);
        fillRing.style.strokeDashoffset = offset;

        if (shotCount > 0 && shotCount <= totalItems) {
          inner.innerHTML = `<span class="dl-counter-text">${shotCount}/${totalItems}</span>`;
        }
      }

      await setReelDownloaded(currentReel.id, true);
      isDownloading = false;

      fillRing.classList.add('done');
      fillRing.style.strokeDashoffset = 0;
      inner.innerHTML = '<span style="color: var(--success); font-size: 14px;">✓</span>';
      showToast('⚡ All Shots Saved Offline!');

      setTimeout(() => {
        dlBtn.classList.add('hidden');
      }, 1600);
    }

    /* ========================================================================
       RENDER SHOTS & FLUID SLIDE-OUT COMPLETION ANIMATION
       ======================================================================== */
    async function renderShots(reel) {
      const container = document.getElementById('shots-container');
      container.innerHTML = '';

      const checkedShots = getCheckedShots(reel.id);
      const basePath = reel.reel_json ? reel.reel_json.substring(0, reel.reel_json.lastIndexOf('/') + 1) : 'data/reels/' + reel.id + '/';

      for (const shot of reel.shots) {
        const isDone = checkedShots.includes(shot.id);
        const card = document.createElement('article');
        card.className = `shot-card ${isDone ? 'completed' : ''}`;
        card.id = `shot-${shot.id}`;
        card.style.order = isDone ? '1' : '0';

        const fullClipUrl = resolveMediaUrl(basePath + shot.clip);

        card.innerHTML = `
          <div class="shot-header" onclick="toggleShot(${shot.id})">
            <div class="shot-check">
              <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
            </div>
            <div class="shot-meta">
              <div class="shot-title-text">${shot.title}</div>
              <div class="shot-duration-pill">Duration: ${shot.duration}</div>
            </div>
          </div>
          <div class="shot-gif-box">
            <img id="img-shot-${shot.id}" src="${fullClipUrl}" alt="${shot.title}" loading="lazy">
          </div>
        `;
        container.appendChild(card);

        getMediaBlob(fullClipUrl).then(blob => {
          if (blob) {
            const blobUrl = URL.createObjectURL(blob);
            objectUrlMap.set(fullClipUrl, blobUrl);
            const img = document.getElementById(`img-shot-${shot.id}`);
            if (img) img.src = blobUrl;
          }
        });
      }
    }

    function toggleShot(shotId) {
      if (!currentReel) return;

      const checked = getCheckedShots(currentReel.id);
      const card = document.getElementById(`shot-${shotId}`);
      if (!card) return;

      if (checked.includes(shotId)) {
        const updated = checked.filter(id => id !== shotId);
        card.classList.remove('completed');
        card.classList.remove('animating-out');
        card.style.order = '0';
        localStorage.setItem(`reelshot_checks_${currentReel.id}`, JSON.stringify(updated));
        updateProgress();
      } else {
        card.classList.add('animating-out');
        setTimeout(() => {
          const updated = [...checked, shotId];
          card.classList.remove('animating-out');
          card.classList.add('completed');
          card.style.order = '1';
          localStorage.setItem(`reelshot_checks_${currentReel.id}`, JSON.stringify(updated));
          updateProgress();
        }, 340);
      }
    }

    function getCheckedShots(reelId) {
      return JSON.parse(localStorage.getItem(`reelshot_checks_${reelId}`) || '[]');
    }

    function updateProgress() {
      if (!currentReel) return;
      const checked = getCheckedShots(currentReel.id);
      const total = currentReel.total_shots || currentReel.shots.length;
      const count = checked.length;
      const pct = Math.round((count / total) * 100);

      document.getElementById('counter-text').textContent = `${count} / ${total} Shots (${pct}%)`;
      document.getElementById('detail-progress-fill').style.width = `${pct}%`;
    }

    /* ========================================================================
       REEL OPTIONS & MANAGEMENT
       ======================================================================== */
    async function clearOfflineFilesForCurrentReel() {
      if (!currentReel) return;
      if (!confirm(`Clear downloaded offline GIFs for "${currentReel.title}"? (The reel card remains on your board, but requires internet to view)`)) return;

      await purgeReelMedia(currentReel.id);
      await setReelDownloaded(currentReel.id, false);
      await updateDownloadButtonState();
      closeOptionsModal();
      showToast('Offline files cleared for this reel');
    }

    // Remove from Trip Board (Wipes device storage, keeps master in library)
    async function removeCurrentReelFromBoard() {
      if (!currentReel) return;
      const title = currentReel.title;
      if (!confirm(`Remove "${title}" from your Trip Board? (Its downloaded GIFs will be cleared to save phone storage, but the reel stays permanently safe in your Master Library)`)) return;

      const reelId = currentReel.id;

      // 1. Purge phone storage
      await purgeReelMedia(reelId);
      localStorage.removeItem(`reelshot_checks_${reelId}`);

      // 2. Remove from active board
      let activeIds = getActiveReelIds();
      activeIds = activeIds.filter(id => id !== reelId);
      setActiveReelIds(activeIds);

      closeOptionsModal();
      showToast(`Removed "${title}" from Trip Board`);
      showHomeView();
    }

    function resetChecksForCurrentReel() {
      if (!currentReel) return;
      localStorage.removeItem(`reelshot_checks_${currentReel.id}`);
      renderShots(currentReel);
      updateProgress();
      closeOptionsModal();
      showToast('Checklist reset');
    }

    function openOptionsModal() {
      if (currentReel) {
        document.getElementById('options-modal-reel-name').textContent = `Options for: ${currentReel.title}`;
      }
      document.getElementById('options-modal').classList.add('active');
    }
    function closeOptionsModal() {
      document.getElementById('options-modal').classList.remove('active');
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      document.getElementById('toast-text').textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2800);
    }

    loadMasterCatalog();

    // Register Service Worker for offline PWA shell caching (HTTPS / GitHub Pages)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => {
          console.warn('SW registration skipped:', err);
        });
      });
    }
  </script>
</body>
</html>
